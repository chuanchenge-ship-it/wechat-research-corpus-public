<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信公众号宏观研究索引</title><meta name="description" content="可检索、可下载、可审计的微信公众号宏观研究元数据索引"><style>
:root{--ink:#17202a;--muted:#687783;--line:#dce2e5;--paper:#f6f7f7;--accent:#b45309;--teal:#0f766e}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;letter-spacing:0}header{position:sticky;top:0;z-index:4;background:#ffffffed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}nav{max-width:1280px;height:60px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}nav b{font:700 18px Georgia,"Songti SC",serif}nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:13px}.page{max-width:1280px;margin:auto;padding:38px 24px 70px}.top{display:grid;grid-template-columns:1.4fr .6fr;gap:48px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:27px}.top small{color:var(--accent);font-weight:800}.top h1{font:700 38px/1.2 Georgia,"Songti SC",serif;margin:6px 0 10px}.top p{max-width:760px;color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:1fr 1fr;border-left:3px solid var(--teal);padding-left:18px}.stats span{color:var(--muted);font-size:12px}.stats b{display:block;color:var(--ink);font:700 24px Georgia,serif}.controls{display:grid;grid-template-columns:minmax(250px,1fr) 220px 160px;gap:10px;margin:25px 0 14px}.controls input,.controls select{width:100%;height:43px;border:1px solid var(--line);background:white;padding:0 12px;color:var(--ink);font:inherit}.summary{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.table{border:1px solid var(--line);background:white}.row{display:grid;grid-template-columns:110px 150px minmax(320px,1fr) 110px 95px;align-items:center;border-top:1px solid var(--line);min-height:64px}.row:first-child{border-top:0}.row>*{padding:11px 14px}.row.head{min-height:38px;background:#17202a;color:white;font-size:12px}.row time,.row span,.row small{color:var(--muted);font-size:12px}.row a{color:var(--ink);font-weight:650;text-decoration:none}.row a:hover{color:var(--accent)}.pill{display:inline-block;border:1px solid var(--line);padding:2px 6px}.empty{padding:50px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:16px;margin-top:28px;color:var(--muted);font-size:12px}@media(max-width:800px){.top{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.table{overflow:auto}.row{min-width:850px}.top h1{font-size:30px}}
</style></head><body><header><nav><b>宏观研究索引</b><div><a href="data/articles.csv">CSV</a><a href="data/articles.jsonl">JSONL</a><a href="data/articles.sqlite">SQLite</a><a href="https://github.com/chuanchenge-ship-it/wechat-research-corpus-public">GitHub</a></div></nav></header><main class="page"><section class="top"><div><small>PUBLIC METADATA DATABASE</small><h1>微信公众号宏观研究索引</h1><p>按研究流、发布时间和质量状态检索公开文章元数据。本站不复制文章正文与图表，阅读请跳转原始来源。</p></div><div class="stats"><span>文章记录<b id="articleCount"></b></span><span>图表索引<b id="figureCount"></b></span><span>时间范围<b id="dateRange" style="font-size:15px"></b></span><span>数据版本<b id="version" style="font-size:15px"></b></span></div></section><section class="controls"><input id="q" type="search" placeholder="搜索标题、公众号或发布机构" aria-label="搜索"><select id="stream"><option value="">全部研究流</option>__OPTIONS__</select><select id="quality"><option value="">全部质量状态</option><option value="clean">clean</option><option value="flagged">flagged</option></select></section><div class="summary"><span id="resultCount"></span><span>标题与日期属于事实性元数据</span></div><div class="table"><div class="row head"><span>日期</span><span>研究流</span><span>文章</span><span>内容状态</span><span>质量</span></div><div id="rows"></div></div><footer>数据库元数据采用 ODC-By 1.0。文章、图表及商标权利仍归原权利人所有。本项目与微信及相关研究机构无隶属关系。</footer></main><script>
const STATS=__STATS__,DATA=__ROWS__;const $=id=>document.getElementById(id);$('articleCount').textContent=STATS.article_count.toLocaleString();$('figureCount').textContent=STATS.figure_count.toLocaleString();$('dateRange').textContent=STATS.date_min.slice(0,4)+'–'+STATS.date_max.slice(0,4);$('version').textContent=STATS.source_commit.slice(0,8);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('q').value.trim().toLowerCase(),stream=$('stream').value,quality=$('quality').value;const found=DATA.filter(x=>(!q||[x.title,x.research_stream,x.publisher_account].join(' ').toLowerCase().includes(q))&&(!stream||x.research_stream===stream)&&(!quality||x.quality_status===quality));$('resultCount').textContent=`找到 ${found.length.toLocaleString()} 条记录`;const shown=found.slice(0,500);$('rows').innerHTML=shown.length?shown.map(x=>`<article class="row"><time>${esc(x.published_date||"日期待核")}</time><span>${esc(x.research_stream)}</span><div><a href="${esc(x.source_url)}" target="_blank" rel="noreferrer">${esc(x.title)}</a><br><small>${esc(x.publisher_account)} · ${Number(x.figure_count||0)} 图</small></div><span><i class="pill">${esc(x.content_status)}</i></span><span>${esc(x.quality_status)}</span></article>`).join(''):'<div class="empty">没有符合条件的记录</div>'}['q','stream','quality'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();
</script></body></html>
